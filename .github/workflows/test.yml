name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: |
            **/uv.lock
            **/pyproject.toml

      - name: Install dependencies
        run: uv pip install -e ".[dev]" --system

      - name: Run tests
        run: uv run pytest

      - name: TEMP dump chart renders
        if: always()
        run: uv run python -m tests._dump_charts

      - name: TEMP upload chart renders
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-charts
          path: ci-charts/
